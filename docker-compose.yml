services:
  api:
    build:
      context: .
      target: development
    container_name: codequest-api-dev
    restart: unless-stopped
    command: npm run start:dev
    ports:
      # 3001 externo evita chocar con `npm run start:dev` local en 3000.
      - '${API_PORT:-3001}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db_dev:5432/${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - .:/app
      - codequest_node_modules:/app/node_modules
    depends_on:
      postgres_db_dev:
        condition: service_healthy

  postgres_db_dev:
    image: postgres:17-alpine
    container_name: codequest-postgres-dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - codequest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codequest_postgres_data:
  codequest_node_modules:
